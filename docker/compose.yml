name: orquestra

# ADR-001: a KEK nunca é variável de ambiente (vaza em `docker inspect` e em dump de
# processo) — é um secret montado em arquivo. Um arquivo por versão, nome do arquivo é
# o número da versão; `KEK_DIR` aponta para o diretório onde eles ficam montados.
# Gere a v1 com: `openssl rand -out docker/secrets/kek/1 32`
secrets:
  kek_v1:
    file: ./secrets/kek/1

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORQUESTRA_APP_DB_PASSWORD: ${ORQUESTRA_APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-orquestra-roles.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://orquestra_app:${ORQUESTRA_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_URL: postgres://orquestra_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      API_PORT: ${API_PORT:-3000}
      PROCESS_ROLE: api
      KEK_DIR: /run/secrets/kek
    secrets:
      - source: kek_v1
        target: kek/1
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Nome do serviço na rede interna do compose — o default do vite.config.ts
      # (localhost:3000) só serve pra rodar o web fora do Docker.
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres-data:
